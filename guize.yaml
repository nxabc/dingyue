  # Telegram / 社交
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,discord,💬 社交通讯
  - RULE-SET,whatsapp,💬 社交通讯
  - RULE-SET,instagram,💬 社交通讯
  - RULE-SET,twitter,💬 社交通讯

  # 开发
  - RULE-SET,github,🐙 开发服务
  - RULE-SET,gitlab,🐙 开发服务

  # Microsoft / Apple
  - RULE-SET,onedrive,Ⓜ️ 微软服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,apple,🍎 Apple

  # 游戏
  - RULE-SET,steam,🎮 游戏平台
  - RULE-SET,epic,🎮 游戏平台
  - RULE-SET,playstation,🎮 游戏平台
  - RULE-SET,xbox,🎮 游戏平台

  # 测速
  - RULE-SET,speedtest,📡 测速服务

  # 国内媒体
  - RULE-SET,bilibili,🎬 国内媒体

  # Google放在Gemini/YouTube等专项之后
