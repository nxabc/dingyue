  - RULE-SET,openai,🤖 AI服务
  - RULE-SET,claude,🤖 AI服务
  - RULE-SET,gemini,🤖 AI服务

  - RULE-SET,netflix,🎞️ Netflix

  - RULE-SET,bilibili_intl,🇭🇰 港澳台媒体
  - RULE-SET,bahamut,🇭🇰 港澳台媒体

  - RULE-SET,disney,📺 国际流媒体
  - RULE-SET,primevideo,📺 国际流媒体
  - RULE-SET,global_media,📺 国际流媒体

  - RULE-SET,bilibili,🎬 国内流媒体

  - RULE-SET,telegram,✈️ Telegram
