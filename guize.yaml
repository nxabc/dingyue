# ============================================================
# 3X-UI / Clash / Mihomo 通用分流规则 v2
# 设计：基础规则 + 成熟专项规则混合优化
# 基础：MetaCubeX meta-rules-dat
# 专项：blackmatrix7 ios_rule_script
# 仅包含公共规则与策略，不包含任何节点、订阅、UUID、IP、域名或个人信息
# 节点由 3X-UI 自动注入
# ============================================================

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    proxies:
      - "♻️ 自动选择"
      - "🛟 故障转移"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🛟 故障转移"
    type: fallback
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    lazy: true

  - name: "🤖 AI服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"

  - name: "🌐 Google服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"

  - name: "📺 国际媒体"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"

  - name: "🎬 国内媒体"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "✈️ Telegram"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"

  - name: "💬 社交通讯"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"

  - name: "🐙 开发服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"
      - DIRECT

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"

  - name: "🍎 Apple"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"

  - name: "📡 测速服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"

  - name: "🛡️ 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛟 故障转移"
      - DIRECT

rule-providers:
