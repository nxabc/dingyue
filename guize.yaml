# guize.yaml v3
# 3X-UI / Clash Verge / Mihomo
# 节点由 3X-UI 自动注入；本文件仅含公共规则与策略组

proxy-groups:
  - name: "🚀 全球加速"
    type: select
    include-all: true
    proxies: ["♻️ 自动选择", "🛟 故障转移", DIRECT]

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🛟 故障转移"
    type: fallback
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    lazy: true

  - name: "🇺🇸 美国"
    type: select
    include-all: true
    filter: "(?i)(🇺🇸|美国|美國|US|USA|United States)"
    proxies: ["🚀 全球加速"]

  - name: "🇯🇵 日本"
    type: select
    include-all: true
    filter: "(?i)(🇯🇵|日本|JP|Japan)"
    proxies: ["🚀 全球加速"]

  - name: "🇭🇰 香港"
    type: select
    include-all: true
    filter: "(?i)(🇭🇰|香港|HK|Hong Kong)"
    proxies: ["🚀 全球加速"]

  - name: "🇹🇼 台湾"
    type: select
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台灣|TW|Taiwan)"
    proxies: ["🚀 全球加速"]

  - name: "🇸🇬 新加坡"
    type: select
    include-all: true
    filter: "(?i)(🇸🇬|新加坡|SG|Singapore)"
    proxies: ["🚀 全球加速"]

  - name: "🇬🇧 英国"
    type: select
    include-all: true
    filter: "(?i)(🇬🇧|英国|英國|UK|GB|United Kingdom)"
    proxies: ["🚀 全球加速"]

  - name: "🤖 AI服务"
    type: select
    proxies: ["🇺🇸 美国", "🇯🇵 日本", "🇸🇬 新加坡", "🚀 全球加速", "♻️ 自动选择"]

  - name: "🎞️ Netflix"
    type: select
    proxies: ["♻️ 自动选择", "🇺🇸 美国", "🇯🇵 日本", "🇭🇰 香港", "🇹🇼 台湾", "🇸🇬 新加坡", "🇬🇧 英国", "🚀 全球加速"]

  - name: "📺 国际流媒体"
    type: select
    proxies: ["♻️ 自动选择", "🇺🇸 美国", "🇯🇵 日本", "🇭🇰 香港", "🇹🇼 台湾", "🇸🇬 新加坡", "🚀 全球加速"]

  - name: "🎬 国内流媒体"
    type: select
    proxies: [DIRECT, "🚀 全球加速"]

  - name: "🇭🇰 港澳台媒体"
    type: select
    proxies: ["🇭🇰 香港", "🇹🇼 台湾", "🇸🇬 新加坡", "🚀 全球加速"]

  - name: "✈️ Telegram"
    type: select
    proxies: ["♻️ 自动选择", "🇺🇸 美国", "🇸🇬 新加坡", "🇯🇵 日本", "🚀 全球加速"]

  - name: "🐙 开发服务"
    type: select
    proxies: ["♻️ 自动选择", "🚀 全球加速", DIRECT]

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies: [DIRECT, "🚀 全球加速", "♻️ 自动选择"]

  - name: "🍎 Apple"
    type: select
    proxies: [DIRECT, "🚀 全球加速"]

  - name: "🎮 游戏平台"
    type: select
    proxies: [DIRECT, "🚀 全球加速", "♻️ 自动选择"]

  - name: "🇨🇳 国内网站"
    type: select
    proxies: [DIRECT, "🚀 全球加速"]

  - name: "🛡️ 广告拦截"
    type: select
    proxies: [REJECT, DIRECT]

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 全球加速", "♻️ 自动选择", DIRECT]

